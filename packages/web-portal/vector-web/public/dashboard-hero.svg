<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Decorative circles -->
  <circle cx="120" cy="280" r="60" fill="url(#gradient1)" opacity="0.6"/>
  <circle cx="480" cy="320" r="70" fill="url(#gradient2)" opacity="0.5"/>
  
  <!-- Person standing -->
  <g transform="translate(80, 320)">
    <!-- Head -->
    <circle cx="0" cy="-50" r="15" fill="#2D3748"/>
    <!-- Body -->
    <rect x="-8" y="-35" width="16" height="25" rx="3" fill="#4299E1"/>
    <!-- Legs -->
    <rect x="-8" y="-10" width="6" height="20" rx="2" fill="#2C5282"/>
    <rect x="2" y="-10" width="6" height="20" rx="2" fill="#2C5282"/>
    <!-- Arms -->
    <rect x="-12" y="-30" width="4" height="15" rx="2" fill="#4299E1" transform="rotate(-20 -10 -22)"/>
    <rect x="8" y="-30" width="4" height="15" rx="2" fill="#4299E1" transform="rotate(20 10 -22)"/>
  </g>
  
  <!-- Laptop -->
  <g transform="translate(220, 180)">
    <!-- Laptop base/keyboard -->
    <path d="M -140 160 L -120 180 L 120 180 L 140 160 Z" fill="url(#gradient3)"/>
    <rect x="-120" y="160" width="240" height="20" rx="8" fill="#7C3AED"/>
    
    <!-- Laptop screen background -->
    <rect x="-130" y="0" width="260" height="160" rx="12" fill="#1A202C" stroke="url(#gradient4)" stroke-width="6"/>
    
    <!-- Screen content - Profile cards -->
    <g opacity="0.95">
      <!-- Card 1 -->
      <g transform="translate(-80, 30)">
        <rect width="70" height="90" rx="8" fill="url(#cardGradient1)"/>
        <circle cx="35" cy="30" r="18" fill="white"/>
        <rect x="15" y="55" width="40" height="4" rx="2" fill="rgba(255,255,255,0.8)"/>
        <rect x="15" y="63" width="30" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
        <rect x="15" y="71" width="35" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
      </g>
      
      <!-- Card 2 (Center - larger) -->
      <g transform="translate(-35, 20)">
        <rect width="70" height="100" rx="8" fill="url(#cardGradient2)"/>
        <circle cx="35" cy="35" r="20" fill="white"/>
        <rect x="15" y="62" width="40" height="5" rx="2" fill="rgba(255,255,255,0.9)"/>
        <rect x="15" y="71" width="30" height="4" rx="2" fill="rgba(255,255,255,0.7)"/>
        <rect x="15" y="79" width="35" height="4" rx="2" fill="rgba(255,255,255,0.7)"/>
      </g>
      
      <!-- Card 3 -->
      <g transform="translate(40, 30)">
        <rect width="70" height="90" rx="8" fill="url(#cardGradient3)"/>
        <circle cx="35" cy="30" r="18" fill="white"/>
        <rect x="15" y="55" width="40" height="4" rx="2" fill="rgba(255,255,255,0.8)"/>
        <rect x="15" y="63" width="30" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
        <rect x="15" y="71" width="35" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
      </g>
    </g>
  </g>
  
  <!-- Decorative icons around laptop -->
  <!-- Trophy icon -->
  <g transform="translate(120, 100)">
    <path d="M 5 0 L 10 10 L 0 10 Z" fill="#F6AD55"/>
    <circle cx="5" cy="12" r="3" fill="#F6AD55"/>
    <rect x="3" y="15" width="4" height="8" rx="1" fill="#F6AD55"/>
  </g>
  
  <!-- Target/Goal icon -->
  <g transform="translate(480, 80)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#FC8181" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#FC8181" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#FC8181"/>
  </g>
  
  <!-- Search/magnifying glass -->
  <g transform="translate(500, 280)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ED64A6" stroke-width="4"/>
    <line x1="14" y1="14" x2="28" y2="28" stroke="#ED64A6" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Trophy icon bottom right -->
  <g transform="translate(440, 340)">
    <rect x="-8" y="8" width="16" height="3" rx="1.5" fill="#F6AD55"/>
    <path d="M -6 0 Q -6 -8 0 -10 Q 6 -8 6 0 L 6 8 L -6 8 Z" fill="#F6AD55"/>
    <rect x="-3" y="-12" width="6" height="4" rx="1" fill="#F6AD55"/>
  </g>
  
  <!-- Decorative sparkles/stars -->
  <circle cx="160" cy="60" r="3" fill="#F6AD55"/>
  <circle cx="420" cy="140" r="4" fill="#FC8181"/>
  <circle cx="380" cy="200" r="3" fill="#ED64A6"/>
  <circle cx="180" cy="150" r="2.5" fill="#4299E1"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6D28D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#BE185D;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="cardGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:0.85" />
    </linearGradient>
  </defs>
</svg>
